version: '3.8'

services:
  # HTTPE Core Processing Engine Cluster
  httpe-engine:
    build: .
    container_name: httpe-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NUM_SHARDS=8
      - RATE_LIMIT_MAX_TPS=25000
      - REDIS_URL=redis://redis-cluster:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - redis-cluster
      - kafka
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '2.0'
          memory: 2048M
    restart: always

  # Redis Multi-Tier Cache & Idempotency Store
  redis-cluster:
    image: redis:7-alpine
    container_name: httpe-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always

  # Apache Kafka Event Streaming Backbone
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: httpe-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: httpe-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # PostgreSQL Sharded Ledger (Primary Node)
  postgres-ledger:
    image: postgres:16-alpine
    container_name: httpe-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: httpe_ledger
      POSTGRES_USER: httpe_admin
      POSTGRES_PASSWORD: prod_fintech_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

volumes:
  redis_data:
  kafka_data:
  pg_data:
